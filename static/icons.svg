<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- Все иконки: контур в цвет текста (currentColor), штрих 1.6, скруглённые концы.
       Использование: <svg class="i"><use href="/static/icons.svg#name"/></svg> -->
  <defs>
    <g id="_s" fill="none" stroke="currentColor" stroke-width="1.6"
       stroke-linecap="round" stroke-linejoin="round"/>
  </defs>

  <symbol id="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 20h16"/><path d="M5 20v-8h14v8"/><path d="M7 12v8M10 12v8M14 12v8M17 12v8"/>
    <path d="M8 12V9h8v3"/><path d="M12 9V4"/><path d="M12 4h4l-1.2 1.5L16 7h-4"/>
  </symbol>

  <symbol id="grid" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/>
    <rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>
  </symbol>

  <symbol id="inbox" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 13h4l2 3h4l2-3h4"/><path d="M4 13V7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v6"/>
    <path d="M4 13v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/>
  </symbol>

  <symbol id="chat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 12a8 8 0 1 0-3.1 6.3L20 19l-.9-3.1A8 8 0 0 0 20 12Z"/>
  </symbol>

  <symbol id="gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="3"/>
    <path d="M12 3v2.2M12 18.8V21M21 12h-2.2M5.2 12H3M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6M18.4 18.4l-1.6-1.6M7.2 7.2 5.6 5.6"/>
  </symbol>

  <symbol id="key" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="8" cy="14" r="4"/><path d="M11 11 20 4M16 6l2.5 2.5M13.5 8.5 16 11"/>
  </symbol>

  <symbol id="megaphone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 10v4a1 1 0 0 0 1 1h2l4 4V5L7 9H5a1 1 0 0 0-1 1Z"/>
    <path d="M15 9a4 4 0 0 1 0 6M18 7a7 7 0 0 1 0 10"/>
  </symbol>

  <symbol id="chart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 20h16"/><path d="M7 20v-6M12 20V8M17 20v-9"/>
  </symbol>

  <symbol id="pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 21s-6-5.2-6-10a6 6 0 1 1 12 0c0 4.8-6 10-6 10Z"/><circle cx="12" cy="11" r="2.2"/>
  </symbol>

  <symbol id="people" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="9" cy="8" r="3.2"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0"/>
    <path d="M16 5.5a3.2 3.2 0 0 1 0 5.9M17.5 14.5a5.5 5.5 0 0 1 3 4.5"/>
  </symbol>

  <symbol id="book" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 5a2 2 0 0 1 2-2h12v16H7a2 2 0 0 0-2 2V5Z"/><path d="M5 19a2 2 0 0 1 2-2h12"/><path d="M9 7h6"/>
  </symbol>

  <symbol id="shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3 5 6v5c0 4.4 3 8.3 7 10 4-1.7 7-5.6 7-10V6l-7-3Z"/><path d="m9.5 12 1.8 1.8 3.4-3.6"/>
  </symbol>

  <symbol id="exit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/><path d="M10 8 6 12l4 4M6 12h10"/>
  </symbol>

  <symbol id="search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="11" cy="11" r="6"/><path d="m20 20-4.2-4.2"/>
  </symbol>

  <symbol id="plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 5v14M5 12h14"/>
  </symbol>

  <symbol id="send" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="m4 12 16-7-4.5 14L11 13l-7-1Z"/><path d="M20 5 11 13"/>
  </symbol>

  <symbol id="pencil" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="m14.5 5.5 4 4L8 20l-4.5.5L4 16 14.5 5.5Z"/><path d="m12.5 7.5 4 4"/>
  </symbol>

  <symbol id="clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="8"/><path d="M12 8v4l2.5 2.5"/>
  </symbol>

  <symbol id="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="m5 13 4 4L19 7"/>
  </symbol>

  <symbol id="cross" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 6l12 12M18 6 6 18"/>
  </symbol>

  <symbol id="photo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="5" width="16" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/>
    <path d="m4 17 4.5-4.5 3 3L15 12l5 5"/>
  </symbol>

  <symbol id="download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 4v10M8 10l4 4 4-4"/><path d="M5 19h14"/>
  </symbol>

  <symbol id="bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 16v-5a6 6 0 1 1 12 0v5l1.5 2.5H4.5L6 16Z"/><path d="M10 20a2 2 0 0 0 4 0"/>
  </symbol>

  <symbol id="bot" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="5" y="8" width="14" height="10" rx="3"/><path d="M12 8V5M12 5h3"/>
    <circle cx="9.5" cy="13" r="1"/><circle cx="14.5" cy="13" r="1"/>
  </symbol>

  <symbol id="dots" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="6" cy="12" r="0.8"/><circle cx="12" cy="12" r="0.8"/><circle cx="18" cy="12" r="0.8"/>
  </symbol>

  <symbol id="arrow-r" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 12h14M13 6l6 6-6 6"/>
  </symbol>
</svg>
